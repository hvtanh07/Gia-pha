<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gia phả họ Hứa</title>
<meta name="description" content="Cây gia phả họ Hứa – Văn Hàn, Thái Thụy, Thái Bình">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='25' font-size='24' text-anchor='middle'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>Gia phả họ Hứa</h1>
    <span class="sub">Văn Hàn · Thái Thụy · Thái Bình</span>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Tìm theo tên, năm sinh, quê…" autocomplete="off" aria-label="Tìm kiếm">
    <ul id="results" class="results" role="listbox" hidden></ul>
  </div>
</header>

<main id="stage" aria-label="Cây gia phả">
  <svg id="tree" role="img" aria-label="Sơ đồ cây gia phả"></svg>
  <div class="controls" role="toolbar">
    <button id="zoomIn" title="Phóng to" aria-label="Phóng to">+</button>
    <button id="zoomOut" title="Thu nhỏ" aria-label="Thu nhỏ">−</button>
    <button id="fit" title="Vừa màn hình" aria-label="Vừa màn hình">⤢</button>
    <button id="expandAll" title="Mở tất cả các nhánh">Mở hết</button>
    <button id="collapseAll" title="Thu gọn về đời thứ ba">Thu gọn</button>
    <button id="info" title="Ghi chú và chú giải">Ghi chú</button>
  </div>
  <div class="legend">
    <span><i class="sw m"></i>Nam</span>
    <span><i class="sw f"></i>Nữ</span>
    <span><i class="sw warn"></i>Cần xác nhận</span>
  </div>
</main>

<aside id="panel" class="panel" aria-live="polite" hidden>
  <div class="grab" aria-hidden="true"></div>
  <button class="close" id="closePanel" aria-label="Đóng">×</button>
  <div id="panelBody"></div>
</aside>

<dialog id="notes">
  <button class="close" id="closeNotes" aria-label="Đóng">×</button>
  <div id="notesBody"></div>
</dialog>

<script src="vendor/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
